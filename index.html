<title>冰雪故事书 · 魔法词书 | Frozen Storybook & the Magic Word Book</title>
<style>
:root{
  --ink:#243b53;--soft:#5b7189;--paper:#fffdf8;--line:#e3e9f0;
  --blue:#4a86c8;--deep:#2b5f96;--gold:#f6c453;--mint:#5fc493;
  --shadow:0 10px 30px rgba(43,95,150,.13),0 2px 6px rgba(43,95,150,.08);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  color:var(--ink);background:#dcecf9;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
#app{min-height:100vh;position:relative;overflow:hidden}
.screen{min-height:100vh;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.wrap{width:100%;max-width:900px;margin:0 auto}
.hidden{display:none!important}
.bg{position:fixed;inset:0;z-index:0;transition:background 1s ease}
.bg.title{background:linear-gradient(170deg,#173f6f 0%,#3878b4 42%,#9fd0ec 78%,#eaf6ff 100%)}
.bg.map{background:linear-gradient(165deg,#e8f4ff,#f7fbff 55%,#fdf6ea)}
.bg.castle{background:linear-gradient(170deg,#cfe8fb,#eaf5ff 55%,#fffaf0)}
.bg.winter{background:linear-gradient(170deg,#9fc4e4,#dceefb 50%,#f4faff)}
.bg.summer{background:linear-gradient(170deg,#ffe9a8,#fff3cf 45%,#e5f4d4)}
.bg.sea{background:linear-gradient(170deg,#a9d8f0,#ffe2c2 55%,#fff3e0)}
.bg.shop{background:linear-gradient(170deg,#ffdfbe,#fff0dc 48%,#f8e6cf)}
.bg.party{background:linear-gradient(170deg,#e7d9fb,#fbe9f2 48%,#fff2e3)}
.bg.night{background:linear-gradient(170deg,#5b6fa8,#9aa8d4 48%,#dfe4f7)}
.bg.forest{background:linear-gradient(170deg,#8fb6c9,#cfe4ec 48%,#eef6f3)}
.bg.mountain{background:linear-gradient(170deg,#7fa6c8,#cfe3f0 48%,#f2f8fb)}
.bg.finale{background:linear-gradient(165deg,#24528b,#7fa9d6 45%,#ffe7bd)}
#flakes{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-8%;color:#fff;opacity:.7;animation:fall linear infinite;user-select:none}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(112vh) rotate(320deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.2) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(246,196,83,0),var(--shadow)}50%{box-shadow:0 0 0 14px rgba(246,196,83,.3),var(--shadow)}}
@media (prefers-reduced-motion:reduce){.flake{display:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:11px 24px;
  border-radius:17px;font-size:17px;font-weight:800;background:linear-gradient(180deg,#fff,#f2f8ff);color:var(--deep);
  border:2px solid #fff;box-shadow:0 5px 0 #b9d3ea,0 10px 20px rgba(43,95,150,.15);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b9d3ea}
.btn.primary{background:linear-gradient(180deg,#ffd873,#f4b53c);color:#6b4708;border-color:#ffe6a3;box-shadow:0 5px 0 #d79a27,0 10px 20px rgba(214,154,39,.25)}
.btn.primary:active{box-shadow:0 2px 0 #d79a27}
.btn.ghost{background:rgba(255,255,255,.75);font-size:15px;min-height:44px;padding:7px 16px;box-shadow:0 4px 0 rgba(150,180,210,.4)}
.btn.small{min-height:42px;padding:7px 15px;font-size:15px;border-radius:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.topbar{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar .right{display:flex;gap:7px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.85);border-radius:999px;
  padding:6px 14px;font-size:14px;color:var(--deep);font-weight:800}
h1,h2,h3{margin:0 0 8px;line-height:1.3}
.sub{color:var(--soft);font-size:15px}
.en-line{font-size:clamp(20px,3.3vw,29px);font-weight:800;line-height:1.4}
.zh-line{font-size:clamp(15px,2.1vw,18px);color:var(--soft);margin-top:6px}
.center{text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
/* title */
.title-box{text-align:center;color:#fff;margin-top:min(8vh,70px)}
.title-box h1{font-size:clamp(30px,6.5vw,58px);text-shadow:0 4px 18px rgba(20,50,90,.4);letter-spacing:2px}
.title-box .eng{font-family:Georgia,serif;font-size:clamp(15px,2.5vw,22px);opacity:.95}
.title-box .desc{margin:14px auto 22px;max-width:600px;font-size:15.5px;opacity:.94}
.name-field{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 10px}
.name-field input{font-size:17px;padding:13px 17px;border-radius:15px;border:3px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.94);min-width:220px;text-align:center;color:var(--ink);outline:none}
.snowman{font-size:clamp(66px,13vw,120px);filter:drop-shadow(0 12px 18px rgba(20,50,90,.3));animation:bob 3.4s ease-in-out infinite}
/* map */
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.map-head h2{font-size:clamp(22px,3.8vw,32px)}
.pages{display:flex;gap:4px;flex-wrap:wrap;max-width:330px}
.pg{width:19px;height:25px;border-radius:4px 7px 7px 4px;background:#e6edf5;border:1.5px solid #cfdce9}
.pg.on{background:linear-gradient(160deg,#ffe08a,#f6bd45);border-color:#e9ae32;box-shadow:0 2px 6px rgba(230,170,50,.4)}
.act{margin:22px 0 10px;display:flex;align-items:center;gap:10px;color:var(--deep)}
.act h3{font-size:18px;margin:0}.act .line{flex:1;height:2px;background:linear-gradient(90deg,#b9d3ea,transparent)}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.ch-card{background:var(--paper);border-radius:18px;padding:15px;box-shadow:var(--shadow);border:3px solid transparent;
  min-height:158px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;transition:transform .14s}
.ch-card:hover:not(.locked){transform:translateY(-4px)}
.ch-card.locked{opacity:.6;filter:grayscale(.4);cursor:default}
.ch-card.done{border-color:#f2c65c}
.ch-card .num{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:1.4px}
.ch-card .emoji{font-size:33px;line-height:1.1}
.ch-card h3{font-size:17px;margin:0}
.ch-card .eng{font-family:Georgia,serif;font-size:13px;color:var(--soft)}
.ch-card .src{font-size:11.5px;color:#8ba0b5;margin-top:auto}
.ch-card .badge{position:absolute;top:10px;right:10px;font-size:17px}
.ch-card{position:relative}
.tag-comedy{display:inline-block;background:#fff0d6;color:#96690f;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:800}
/* stage */
.stage{flex:1;width:100%;max-width:860px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.actor{display:flex;flex-direction:column;align-items:center;gap:5px}
.avatar{width:clamp(84px,15vw,124px);height:clamp(84px,15vw,124px);border-radius:50%;display:grid;place-items:center;
  font-size:clamp(44px,8vw,66px);background:rgba(255,255,255,.75);border:5px solid rgba(255,255,255,.95);
  box-shadow:0 10px 26px rgba(43,95,150,.2);animation:bob 3.6s ease-in-out infinite}
.actor .who{background:rgba(255,255,255,.92);border-radius:999px;padding:3px 15px;font-weight:800;font-size:14px;color:var(--deep)}
.dlg{width:100%;background:var(--paper);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow);position:relative;min-height:132px}
.dlg .beat{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:1.2px;margin-bottom:6px}
.dlg .actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.speak-btn{border-radius:999px;background:#eaf4ff;color:var(--deep);padding:8px 14px;font-weight:800;font-size:14px;min-height:42px;cursor:pointer}
.reveal-btn{font-size:13.5px;color:var(--soft);text-decoration:underline dotted;padding:7px;cursor:pointer}
.egg-btn{position:absolute;top:8px;right:12px;font-size:19px;opacity:.5;cursor:pointer}
.egg-btn:hover{opacity:1;transform:scale(1.2)}
.cover-card{text-align:center;padding:28px 22px}
.cover-card .big{font-size:clamp(58px,11vw,96px);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.cover-card .author{font-size:13px;color:var(--soft);font-family:Georgia,serif}
.cover-card .mainline{margin-top:14px;background:#f2f8ff;border-radius:14px;padding:12px 16px;font-size:15px;text-align:left}
/* choices / options */
.choices{display:grid;gap:11px;width:100%}
.choice{background:var(--paper);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);
  border:3px solid rgba(255,255,255,.9);min-height:72px;display:flex;gap:12px;align-items:center;transition:transform .12s}
.choice:hover{transform:translateX(5px);border-color:var(--gold)}
.choice .k{font-size:24px;flex:0 0 auto}
.choice strong{display:block;font-size:17px}.choice span{font-size:14.5px;color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;width:100%}
.opt{background:var(--paper);border-radius:16px;padding:13px 10px;min-height:72px;box-shadow:var(--shadow);
  font-size:20px;font-weight:800;border:3px solid transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.opt small{font-size:13.5px;font-weight:500;color:var(--soft)}
.opt:hover{border-color:var(--blue)}
.opt.right{background:#e7f8ef;border-color:var(--mint);color:#1d7a4d}
.opt.wrong{animation:shake .38s ease;border-color:#f0a9a1}
.opt.picked{background:#eaf4ff;border-color:var(--blue)}
.feedback{min-height:32px;font-weight:800;font-size:16px;text-align:center;color:var(--deep)}
.big-emoji{font-size:clamp(72px,14vw,128px);line-height:1;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(43,95,150,.16))}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;width:100%;margin-bottom:12px}
/* puzzle & order */
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;padding:12px;
  background:rgba(255,255,255,.6);border:3px dashed #b9d3ea;border-radius:16px;width:100%}
.slot{min-height:48px;padding:9px 14px;border-radius:12px;background:var(--paper);box-shadow:var(--shadow);font-size:19px;font-weight:800}
.slot.ph{background:rgba(255,255,255,.3);box-shadow:none;color:#a9bccf;border:2px dashed #c9dced}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;margin-top:4px}
.token{background:linear-gradient(180deg,#fff,#eef6ff);border:3px solid #fff;border-radius:12px;padding:9px 15px;
  font-size:19px;font-weight:800;box-shadow:0 4px 0 #c4dcf0;min-height:48px}
.token:active{transform:translateY(3px);box-shadow:0 1px 0 #c4dcf0}.token.hint{outline:4px solid var(--gold)}
.ordercard{background:var(--paper);border-radius:15px;padding:13px 15px;box-shadow:var(--shadow);width:100%;
  text-align:left;border:3px solid transparent;font-size:15px;display:flex;gap:12px;align-items:center}
.ordercard .n{width:28px;height:28px;border-radius:50%;background:#eaf4ff;color:var(--deep);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.ordercard.picked{border-color:var(--gold)}
.ordercard strong{display:block;font-size:16px}.ordercard span{font-size:14px;color:var(--soft)}
/* moment */
.moment{text-align:center;background:rgba(255,255,255,.92);border-radius:26px;padding:26px 22px;box-shadow:var(--shadow);width:100%}
.moment .sentence{font-family:Georgia,serif;font-size:clamp(24px,4.6vw,40px);font-weight:800;color:var(--deep);margin:8px 0}
.moment .zh{font-size:clamp(16px,2.5vw,20px);color:var(--soft)}
.glow{animation:glow 1.7s ease-in-out infinite}
.reveal-big{font-size:clamp(54px,11vw,100px);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
/* lists */
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wordchip{background:var(--paper);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center;cursor:pointer}
.wordchip .x{font-size:26px}.wordchip .e{font-weight:800;font-size:17px}.wordchip .z{font-size:13.5px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);border-radius:14px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:#eaf4ff;color:var(--deep)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;background:rgba(36,59,83,.94);
  color:#fff;padding:12px 20px;border-radius:14px;font-size:15px;max-width:88vw;text-align:center;box-shadow:var(--shadow)}
.footer-note{font-size:12.5px;color:var(--soft);text-align:center;margin-top:18px;opacity:.85}
/* 缺少彩色 emoji 字体时的降级：彩色文字徽章 */
.efb{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;
  font-size:.72em;font-weight:800;line-height:1;vertical-align:-.08em;white-space:nowrap;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.08),0 1px 3px rgba(43,95,150,.16)}
.avatar .efb,.big-emoji .efb,.snowman .efb,.reveal-big .efb{font-size:.56em}
</style>
</head>

<script>
/* ==================== 引擎 ==================== */
const DATA = JSON.parse(document.getElementById('story-data').textContent);
const CH = DATA.chapters, CAST = DATA.cast, GROUPS = DATA.groups;
const KEY = 'frozen_storybook_v1';
const $ = s => document.querySelector(s);
const app = $('#app'), bg = $('#bg');

/* ---------- 图标兼容：缺少彩色 emoji 字体时自动降级为彩色文字徽章 ---------- */
const EMOJI_OK = (()=>{
  try{
    const cv=document.createElement('canvas'); cv.width=cv.height=40;
    const cx=cv.getContext('2d',{willReadFrequently:true}); if(!cx) return true;
    cx.textBaseline='top'; cx.font='30px sans-serif'; cx.fillText('⛄',0,0);
    const d=cx.getImageData(0,0,40,40).data; let colored=0;
    for(let i=0;i<d.length;i+=4){ if(d[i+3]>10 && (d[i]!==d[i+1]||d[i+1]!==d[i+2])) colored++; }
    return colored>15;
  }catch(e){ return true; }
})();
const EMAP={};
function reg(k,v){ if(k&&!EMAP[k]) EMAP[k]=v; }
Object.values(CAST).forEach(v=>reg(v.x,v.z[0]));
CH.forEach(c=>{
  reg(c.x,c.z[0]); c.words.forEach(w=>reg(w.x,w.z[0]));
  reg(c.moment.x,c.z[0]); reg(c.sticker.x,'★');
  c.choice.opts.forEach(o=>{ reg(o.fx.x,'★'); reg(o.st.x,'★'); });
});
[['📚','书'],['📖','书'],['🗺','图'],['⭐','星'],['🔊','音'],['🔇','音'],['🏠','家'],
 ['🎉','庆'],['✅','✓'],['❄️','雪'],['☀️','日'],['🔍','查'],['🗣','说'],['💡','示'],
 ['✦','✧'],['🅰','A'],['🅱','B'],['🅲','C'],['👩‍🏫','师'],['🔁','换'],['🔓','开'],
 ['❔','?'],['🕊️','柔'],['🧣','暖'],['⏳','等'],['🏅','奖']].forEach(x=>reg(x[0],x[1]));
const ERE=/[\u{1F000}-\u{1FAFF}\u{2300}-\u{23FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]+/gu;
function labelFor(s){
  if(EMAP[s]) return EMAP[s];
  for(const ch of s){ if(EMAP[ch]) return EMAP[ch]; }
  return '★';
}
function hashHue(s){ let h=0; for(const ch of s) h=(h*31+ch.codePointAt(0))>>>0; return h%360; }
function patch(root){
  if(!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), nodes=[];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; if(!t) return;
    ERE.lastIndex=0; if(!ERE.test(t)) return;
    ERE.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0,m;
    while((m=ERE.exec(t))){
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='efb';
      sp.textContent=labelFor(m[0]); sp.title=m[0];
      const h=hashHue(m[0]);
      sp.style.background=`linear-gradient(150deg,hsl(${h} 88% 89%),hsl(${h} 72% 73%))`;
      sp.style.color=`hsl(${h} 62% 26%)`;
      frag.appendChild(sp); last=m.index+m[0].length;
    }
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    if(n.parentNode) n.parentNode.replaceChild(frag,n);
  });
}
if(!EMOJI_OK){
  let busy=false;
  const mo=new MutationObserver(()=>{
    if(busy) return; busy=true; mo.disconnect(); patch(app);
    mo.takeRecords(); mo.observe(app,{childList:true,subtree:true,characterData:true}); busy=false;
  });
  mo.observe(app,{childList:true,subtree:true,characterData:true});
}

function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function T(v){ return typeof v === 'string' ? v : (v && (v[state.flags.ch5] || v._ || Object.values(v)[0])) || ''; }
function P(s){ return esc(T(s)).replace(/\{name\}/g, esc(state.name || 'Friend')); }
function stat(i){ if(!state.stats[i]) state.stats[i]={word:0,puzzle:0,order:0,reads:0,choice:''}; return state.stats[i]; }
function unlocked(i){ return state.classroom || i===0 || state.completed.includes(i-1); }

/* ---------- 语音 ---------- */
function speak(text, lang){
  if(!state.sound || !('speechSynthesis' in window) || !text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = lang || 'en-US'; u.rate = lang && lang.indexOf('zh')===0 ? .9 : .78; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
    if(play && play.i!=null) stat(play.i).reads++;
  }catch(e){}
}
function toast(msg){
  const old=$('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast'; d.innerHTML=msg; document.body.appendChild(d);
  if(!EMOJI_OK) patch(d);
  setTimeout(()=>d.remove(),3200);
}
function setBg(theme){ bg.className='bg '+(theme||'map'); }
function flakes(){
  const f=$('#flakes'); if(!f.childNodes.length){
    for(let i=0;i<18;i++){ const s=document.createElement('span'); s.className='flake'; s.textContent=i%3?'❄':'✦';
      s.style.left=(Math.random()*100)+'%'; s.style.fontSize=(10+Math.random()*16)+'px';
      s.style.animationDuration=(9+Math.random()*12)+'s'; s.style.animationDelay=(-Math.random()*14)+'s'; f.appendChild(s); }
  }
}

/* ---------- 章节步骤生成（线性主干 + 分支收敛） ---------- */
function buildSteps(c){
  const s=[{k:'cover'}];
  c.beats[0].lines.forEach(l=>s.push(Object.assign({k:'say',act:c.beats[0].act},l)));
  s.push({k:'words'});
  c.beats[1].lines.forEach(l=>s.push(Object.assign({k:'say',act:c.beats[1].act},l)));
  s.push({k:'order'});
  c.beats[2].lines.forEach(l=>s.push(Object.assign({k:'say',act:c.beats[2].act},l)));
  s.push({k:'puzzle'},{k:'choice'},{k:'moment'},{k:'end'});
  return s;
}
let play=null;
function startChapter(i){
  play={i, steps:buildSteps(CH[i]), si:0, queue:[], reveal:false, sub:null, eggShown:false, momentDone:false};
  state.view='play'; setBg(CH[i].theme); render();
  nextStep();
}
function nextStep(){
  play.reveal=false; play.sub=null;
  if(play.queue.length){ play.step=play.queue.shift(); render(); if(state.autoRead) autoSay(); return; }
  if(play.si>=play.steps.length){ finishChapter(); return; }
  play.step=play.steps[play.si++];
  render(); if(state.autoRead) autoSay();
}
function autoSay(){
  const s=play.step;
  if(s && s.k==='say') speak(state.mode==='zh'?T(s.z):T(s.e), state.mode==='zh'?'zh-CN':'en-US');
}
function finishChapter(){
  const i=play.i;
  if(!state.completed.includes(i)) state.completed.push(i);
  state.ended = state.completed.length===18; save();
  if(state.ended){ renderFinale(); return; }
  state.view='map'; play=null; renderMap();
  toast(`⭐ 第 ${i+1} 页点亮啦！下一章已解锁 / Page ${i+1} is lit!`);
}
function goMap(){ play=null; state.view='map'; render(); }

/* ---------- 主渲染 ---------- */
function render(){
  if(!play){ renderMap(); return; }
  const c=CH[play.i], s=play.step;
  if(!s){ renderMap(); return; }
  const bar=topbar({back:true});
  let body='';
  switch(s.k){
    case 'cover': body=renderCover(c); break;
    case 'say': body=renderSay(c,s); break;
    case 'words': body=renderWords(c); break;
    case 'order': body=renderOrder(c); break;
    case 'puzzle': body=renderPuzzle(c); break;
    case 'choice': body=renderChoice(c); break;
    case 'moment': body=renderMoment(c); break;
    case 'end': body=renderEnd(c); break;
  }
  app.innerHTML=`<div class="screen"><div class="wrap">${bar}<div class="stage">${body}</div></div></div>`;
}

function renderWords(c){
  if(!play.sub){
    const order=c.words.map((_,i)=>i); shuffle(order);
    const all=[]; CH.forEach(x=>x.words.forEach(w=>{ if(!all.some(a=>a.e===w.e)) all.push(w); }));
    const qs=order.map(idx=>{
      const w=c.words[idx], pool=all.filter(a=>a.e!==w.e); shuffle(pool);
      const opts=[w,pool[0],pool[1],pool[2]]; shuffle(opts);
      return {w,opts,answer:opts.indexOf(w)};
    });
    play.sub={k:'words',qs,pos:0,done:false,wrong:false,ok:false};

  }
  return `<div class="moment glow" style="max-width:660px">
    <div class="sub">✨ 魔法句时刻 / The Magic Sentence</div>

}

/* ---------- 词库 / 贴纸 / 家长角 / 结局 ---------- */
function renderBook(view){

    if(!done.includes(i) && !state.classroom) return;
    html+=`<div class="act"><h3>${String(c.n).padStart(2,'0')} · ${esc(c.z)}</h3><span class="sub" style="font-size:13px">${esc(c.e)}</span><span class="line"></span></div>
      <div class="list">${c.words.map(w=>`<button class="wordchip" data-act="say-en" data-e="${esc(w.e)}"><div class="x">${w.x}</div><div class="e">${esc(w.e)}</div><div class="z">${esc(w.z)}</div></button>`).join('')}</div>
      <div class="card" style="margin-top:8px;box-shadow:none;background:#fff8e6;padding:10px 14px">
        <b style="font-family:Georgia,serif">${esc(c.magic.e)}</b> <span class="sub">/ ${esc(c.magic.z)}</span>

  app.innerHTML=`<div class="screen"><div class="wrap">${topbar({back:true})}
    <h2>📚 我的词库 / My Word Book</h2>
    <div class="sub" style="margin-bottom:14px">已点亮 ${done.length}/18 页 · 累计 ${done.length*6} 个单词 · ${done.length} 句简单表达 · 点任意卡片可听发音</div>

}
function renderStickers(){

        <b style="font-size:14px">${esc(s.z)}</b><div class="sub" style="font-size:12px">${esc(s.e)}</div>

    <div class="sub" style="margin-bottom:14px">每章的选择都会得到一张不同的贴纸 · 已收集 ${Object.keys(state.stickers).length}/18 · 隐藏雪花 ❄️ ${eggs}/18</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">${cards}</div>
    ${eggs===18?'<div class="card center" style="margin-top:16px;background:#fff8e6">🏅 <b>隐藏徽章已解锁</b> — 18 片雪花拼成了词书的最后一页，去结局里看看吧！</div>':''}
    </div></div>`;
}
function renderParent(){
  setBg('map');

  CH.forEach((c,i)=>{
    const s=state.stats[i], done=state.completed.includes(i);
    rows+=`<tr><td>${c.n}. ${esc(c.z)}</td><td>${done?'✅ 已完成':'—'}</td>
      <td>${s?s.word:0}</td><td>${s?s.order:0}</td><td>${s?s.puzzle:0}</td><td>${s?s.reads:0}</td>
      <td>${s&&s.choice?esc(s.choice):'—'}</td><td>${state.eggs[i]?'❄️':'—'}</td></tr>`;
  });
  app.innerHTML=`<div class="screen"><div class="wrap">${topbar({back:true})}
    <h2>👩‍🏫 家长角 / For Grown-ups</h2>
    <div class="card" style="margin-bottom:14px">
      <b>进度</b>：${state.completed.length}/18 章 · ${state.completed.length*6} 词 · ${state.completed.length} 句 · 贴纸 ${Object.keys(state.stickers).length}/18 · 隐藏雪花 ${Object.keys(state.eggs).filter(k=>state.eggs[k]).length}/18
      <div class="sub" style="margin-top:6px">「尝试次数」只作为复习参考，不参与评分、不显示给孩子。答错不扣分，也没有计时。数据只存在本机浏览器，不会上传。</div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost small" data-act="toggle-auto">🔁 自动朗读：${state.autoRead?'开':'关'}</button>
        <button class="btn ghost small" data-act="toggle-class">🔓 课堂模式（解锁全部）：${state.classroom?'开':'关'}</button>
        <button class="btn ghost small" data-act="reset">↺ 清空进度</button>
      </div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>章节</th><th>状态</th><th>单词尝试</th><th>情节排序尝试</th><th>拼句尝试</th><th>朗读次数</th><th>所选分支</th><th>彩蛋</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="card" style="margin-top:14px;background:#f2f8ff;box-shadow:none">
      <b>📌 共读建议</b><br>
      <span class="sub">· 先用「中英对照」，读熟后切到「English」再读一遍；「中文」模式适合先理解故事。<br>
      · 每章的「排情节」可以让孩子用自己的话复述起因、经过、结果，这是全书主线的核心练习。<br>
      · 「魔法句」是每篇主题凝成的一句简单表达，鼓励孩子在生活中照着说一次。<br>
      · 三个分支没有对错，可以重玩同一章，看看不同选择里角色会说什么。</span></div>
    </div></div>`;
}
function renderFinale(){
  setBg('finale');
  const eggs=Object.keys(state.eggs).filter(k=>state.eggs[k]).length;
  const secrets = eggs===18 ? `<div class="card" style="margin-top:14px;background:#fff8e6">
    <h3>🏅 隐藏的最后一页 / The Last Page</h3>
    <div class="en-line" style="font-size:20px">A long time ago, the first word carved into Bulda's crystal was: Hello.</div>
    <div class="zh-line">很久很久以前，布达的水晶上刻下的第一个词是：Hello（你好）。</div>
    <div class="sub" style="margin-top:8px">你集齐了 18 片隐藏雪花，才翻到这一页。全书 18 篇故事，原来是从一个招呼开始的。</div></div>`:'';
  app.innerHTML=`<div class="screen"><div class="wrap">
    ${topbar({back:true})}
    <div class="card center" style="padding:30px 22px;background:rgba(255,253,248,.96)">
      <div style="font-size:clamp(64px,12vw,110px);animation:pop .7s">📖✨</div>
      <h2>词书，合上了。/ The Book Closes.</h2>
      <div class="sub">18 篇故事，18 页全部亮起 · ${18*6} 个单词 · 18 句简单的话</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px 0">
        ${CH.map(c=>`<span style="font-size:24px" title="${esc(c.z)}">${c.x}</span>`).join('')}</div>
      <div class="en-line" style="font-size:20px">"Hello, ${esc(state.name||'Friend')}."</div>
      <div class="zh-line">扉页上写着你的名字：你好，${esc(state.name||'小朋友')}。</div>
      <div class="sub" style="margin-top:12px;max-width:560px;margin-left:auto;margin-right:auto">
        从艾莎关上的那扇门，到安娜牵起的那只手；从一场歪掉的生日蛋糕，到一块留给别人的糖——<br>
        Every single story was really about one small sentence said out loud.</div>
      ${secrets}
      <div class="row" style="margin-top:20px">
        <button class="btn primary" data-act="map">🗺 回目录重读</button>
        <button class="btn ghost small" data-act="book">📚 我的词库</button>
        <button class="btn ghost small" data-act="stickers">⭐ 贴纸册</button>
        <button class="btn ghost small" data-act="title">🏠 首页</button>
      </div></div>
    <div class="footer-note" style="color:#fff">全书 18 篇篇目、作者、顺序与主线，均依据附件《Frozen Storybook Collection》指南保留</div>
  </div></div>`;
}

/* ==================== 交互 ==================== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, i=parseInt(b.dataset.i), j=parseInt(b.dataset.j);
  switch(a){
    case 'mode': state.mode = state.mode==='both'?'en':state.mode==='en'?'zh':'both'; save(); renderCurrent(); break;
    case 'sound': state.sound=!state.sound; if(!state.sound&&'speechSynthesis'in window)speechSynthesis.cancel(); save(); renderCurrent(); break;
    case 'start': {
      const v=$('#nameInput'); state.name=(v&&v.value.trim())||'Friend'; save(); goMap(); break;
    }
    case 'continue': goMap(); break;
    case 'title': play=null; renderTitle(); break;
    case 'map': goMap(); break;
    case 'book': play=null; renderBook(); break;
    case 'stickers': play=null; renderStickers(); break;
    case 'parent': play=null; renderParent(); break;
    case 'finale': play=null; renderFinale(); break;
    case 'open': startChapter(i); break;
    case 'next': {
      // 结局由最后一章 end 触发
      if(play && play.step && play.step.k==='end' && play.i===17){ finishChapter(); }
      else nextStep(); break;
    }
    case 'reveal': play.reveal=true; render(); break;
    case 'say-en': speak(b.dataset.e||T(play&&play.step&&play.step.e),'en-US'); break;
    case 'say-zh': speak(b.dataset.z||T(play&&play.step&&play.step.z),'zh-CN'); break;
    case 'egg': {
      if(play.eggShown) break; play.eggShown=true; state.eggs[play.i]=true; save();
      const c=CH[play.i];
      toast('❄️ '+esc(T(c.egg.e))+'<br>'+esc(T(c.egg.z))); b.remove(); break;
    }
    /* 单词关 */
    case 'word-opt': {
      const q=play.sub, cur=q.qs[q.pos]; stat(play.i).word++;
      if(j===cur.answer){ q.ok=true; q.wrong=false; speak(cur.w.e,'en-US'); }
      else { q.wrong=true; q.ok=false; }
      save(); render(); break;
    }
    case 'word-next': {
      const q=play.sub;
      if(q.pos+1>=q.qs.length){ play.sub=null; nextStep(); }
      else { q.pos++; q.ok=false; q.wrong=false; render(); }
      break;
    }
    /* 情节排序 */
    case 'order-pick': {
      const q=play.sub; stat(play.i).order++;
      q.picked.push(q.arr[j]); q.wrong=false;
      if(q.picked.length===3){
        if(q.picked.every((p,k)=>p.idx===k)){ q.ok=true; speak('Well done! The story is in order.','en-US'); }
        else q.wrong=true;
      }
      save(); render(); break;
    }
    case 'order-undo': { const q=play.sub; q.picked.splice(j,1); q.ok=false; q.wrong=false; render(); break; }
    case 'order-reset': { const q=play.sub; q.picked=[]; q.ok=false; q.wrong=false; shuffle(q.arr); render(); break; }
    /* 拼句 */
    case 'token-pick': {
      const q=play.sub; q.slots.push(q.pool.splice(j,1)[0]); q.wrong=false; q.hint=false;
      const c=CH[play.i];
      if(q.slots.length===c.magic.t.length){
        stat(play.i).puzzle++;
        if(q.slots.map(x=>x.txt).join(' ')===c.magic.e){ q.ok=true; speak(c.magic.e,'en-US'); }
        else q.wrong=true;
      }
      save(); render(); break;
    }
    case 'token-undo': { const q=play.sub; const t=q.slots.splice(j,1)[0]; if(t) q.pool.push(t); q.ok=false; q.wrong=false; render(); break; }
    case 'puzzle-hint': play.sub.hint=true; render(); break;
    case 'puzzle-reset': {
      const c=CH[play.i], t=c.magic.t.map((txt,idx)=>({txt,idx})); shuffle(t);
      play.sub={k:'puzzle',pool:t,slots:[],wrong:false,ok:false,hint:false}; render(); break;
    }
    /* 选择 */
    case 'choice-pick': {
      const c=CH[play.i], o=c.choice.opts[j];
      play.sub.picked=j; state.flags['ch'+c.n]=o.tag;
      state.stickers[play.i]={x:o.st.x,z:o.st.z,e:o.st.e};
      stat(play.i).choice=o.tag; save(); render(); break;
    }
    /* 魔法句 */
    case 'moment-say': {
      const c=CH[play.i]; speak(c.magic.e,'en-US');
      play.sub.done=true;
      if(!state.completed.includes(play.i)) state.completed.push(play.i);
      save(); render(); break;
    }
    case 'toggle-auto': state.autoRead=!state.autoRead; save(); renderParent(); break;
    case 'toggle-class': state.classroom=!state.classroom; save(); renderParent(); break;
    case 'reset': {
      if(confirm('确定清空全部进度吗？（不可恢复）')){
        localStorage.removeItem(KEY);
        state={name:state.name,mode:state.mode,sound:state.sound,autoRead:false,classroom:false,completed:[],stickers:{},eggs:{},flags:{},stats:{},ended:false};
        save(); play=null; renderTitle();
      }
      break;
    }
  }
});
/* 点击台词直接朗读（不含按钮区域） */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-speak]');
  if(t && !e.target.closest('[data-act]')) speak(t.dataset.speak,t.dataset.lang);
});
/* 键盘：Enter/Space 继续，1/2/3 选择，Esc 回目录 */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && play){ goMap(); return; }
  if(!play) return;
  if(e.key==='Enter'||e.key===' '){
    if(e.target.tagName==='INPUT') return;
    const nx=app.querySelector('[data-act="next"],[data-act="word-next"]');
    if(nx){ e.preventDefault(); nx.click(); }
  }
  if(['1','2','3'].includes(e.key)){
    const opts=app.querySelectorAll('[data-act="choice-pick"],[data-act="word-opt"],[data-act="order-pick"]');
    const k=parseInt(e.key)-1; if(opts[k]) opts[k].click();
  }
});
function renderCurrent(){
  if(!play){
    const h=app.querySelector('h2');
    if(!h){ renderTitle(); return; }
    const t=h.textContent;
    if(t.indexOf('故事目录')>=0) renderMap();
    else if(t.indexOf('词库')>=0) renderBook();
    else if(t.indexOf('贴纸册')>=0) renderStickers();
    else if(t.indexOf('家长角')>=0) renderParent();
    else if(t.indexOf('词书，合上')>=0) renderFinale();
    else renderTitle();
  } else render();
}
renderTitle();
